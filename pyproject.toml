[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-bus"
version = "1.4.1"
description = "Cross-window file-mailbox bus for DSH (and any process): send tasks, wait for receipts, relay work between agent sessions. Zero-dependency core."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dsh-bus authors" }]
keywords = ["dsh", "agent", "ipc", "message-bus", "file-mailbox", "mcp", "cross-window"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=7"]

[project.scripts]
dshbus = "dshbus:main"
dshbus-mcp = "dshbus_mcp:main"

[project.urls]
Homepage = "https://github.com/taojun566/dsh-bus"
Issues = "https://github.com/taojun566/dsh-bus/issues"

[tool.setuptools]
py-modules = ["dshbus", "dshbus_mcp"]
