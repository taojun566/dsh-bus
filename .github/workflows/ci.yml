name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test deps
        run: pip install pytest
      - name: Unit + integration locks (25)
        run: python -X utf8 -m pytest tests/ -q
      - name: Two-process smoke E2E
        run: python -X utf8 scripts/smoke_e2e.py

  mcp-smoke:
    strategy:
      fail-fast: false
      matrix:
        entry: [direct, launcher]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        if: matrix.entry == 'launcher'
      - name: Install mcp extra
        run: pip install .[mcp]
      - name: MCP smoke (${{ matrix.entry }})
        env:
          DSHBUS_SMOKE_LAUNCHER: ${{ matrix.entry == 'launcher' && '1' || '' }}
        run: python -X utf8 tests/mcp_smoke.py
